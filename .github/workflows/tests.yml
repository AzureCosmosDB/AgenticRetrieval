name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: |
          pytest tests/ -v \
            --ignore=tests/test_vector_consistency.py \
            --ignore=tests/test_semantic_ranker.py
        # test_vector_consistency.py is a manual live-Cosmos DB diagnostic
        # script (see its own module docstring), not a pytest suite — it
        # parses --config from argv at import time and isn't meant to be
        # collected here.
        #
        # test_semantic_ranker.py currently requires an interactively
        # logged-in Azure CLI (AzureCliCredential) to even collect, so it
        # can't run unattended in CI yet. Tracked as a follow-up rather than
        # bundled into this workflow.
